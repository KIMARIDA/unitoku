#include 

int main() {
 const char *patterns[] = {"▲", "△", "■", "□", "★", "☆", "山"};
 int pattern_num, height;

 // 模様の選択
 while (1) {
 printf("模様を選んでください（1～7）：");
 scanf("%d", &pattern_num);
 if (pattern_num >= 1 && pattern_num <= 7) break;
 printf("エラー：1から7の数字を入力してください。\n");
 }

 // 段数の入力
 while (1) {
 printf("ピラミッドの段数を入力してください（1～20）：");
 scanf("%d", &height);
 if (height >= 1 && height <= 20) break;
 printf("エラー：1から20の数字を入力してください。\n");
 }

 // ピラミッドの描画
 for (int i = 1; i <= height; i++) {
 for (int j = 0; j < height - i; j++) {
 printf(" ");
 }
 for (int k = 0; k < i; k++) {
 printf("%s", patterns[pattern_num - 1]);
 }
 printf("\n");
 }

 return 0;
}
